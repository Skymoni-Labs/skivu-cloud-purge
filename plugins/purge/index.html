<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小云 · 提示词注入</title>
<style>:root{color-scheme:light dark;font-family:system-ui,sans-serif;background:#f6f8fa;color:#20333c}*{box-sizing:border-box}body{margin:0;padding:24px 18px}main{max-width:480px;margin:28px auto;background:#fff;border:1px solid #dce5e8;border-radius:18px;padding:28px 22px}h1{font-size:22px;font-weight:600;margin:0 0 12px}h1[data-phase=verified]{color:#24745e}p{font-size:14px;line-height:1.6;color:#637680;min-height:44px;margin:0 0 24px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;font-size:14px;padding:11px 15px;border:1px solid #cfdbdf;border-radius:11px;background:#fff;color:inherit}button:first-child{background:#246e5b;border-color:#246e5b;color:#fff}button:disabled{opacity:.5}@media(prefers-color-scheme:dark){:root{background:#161e24;color:#e3ebef}main,button{background:#202c34;border-color:#3c505b}p{color:#aabcc5}h1[data-phase=verified]{color:#8bd2b8}}
</style></head><body><main><h1 id="status" role="status" aria-live="polite">正在核验…</h1><p id="detail"></p><div class="actions"><button id="apply" disabled>注入原包提示词</button><button id="revoke" disabled>撤销注入</button></div></main><script src="app.mjs" type="module"></script></body></html>
